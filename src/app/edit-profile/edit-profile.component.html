<ion-header class="edit-profile-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/profile" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Modifier mon profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="edit-profile-content">
  <!-- Affiche un état de chargement si le profil n'est pas encore là -->
  <div *ngIf="!profile" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="profile">
    <!-- Section Avatar -->
    <div class="avatar-section">
      <div class="avatar-container">
        <!-- Idéalement, l'image de profil de l'utilisateur ici -->
        <div class="initials-avatar">
          <span>{{ getInitials(profile.name) }}</span>
        </div>
        <ion-button fill="clear" class="edit-avatar-btn">
          <ion-icon name="camera-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>

    <!-- Formulaire des informations personnelles -->
    <ion-list class="form-list" [inset]="true">
      <ion-list-header>
        <ion-label>Informations Personnelles</ion-label>
      </ion-list-header>

      <ion-item>
        <ion-label position="stacked">Nom complet</ion-label>
        <ion-input [(ngModel)]="profile.name" placeholder="Votre nom et prénom"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Adresse e-mail</ion-label>
        <ion-input type="email" [(ngModel)]="profile.email" placeholder="votre.email@domaine.com"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Numéro de téléphone</ion-label>
        <ion-input type="tel" [(ngModel)]="profile.phone" placeholder="+221 xx xxx xx xx"></ion-input>
      </ion-item>
      
      <ion-item>
        <ion-label position="stacked">Adresse de livraison par défaut</ion-label>
        <ion-textarea [(ngModel)]="profile.location" placeholder="Ex: Cité Keur Gorgui, Lot 123" [autoGrow]="true"></ion-textarea>
      </ion-item>
    </ion-list>

    <!-- Section Sécurité -->
    <ion-list class="form-list" [inset]="true">
      <ion-list-header>
        <ion-label>Sécurité</ion-label>
      </ion-list-header>
      
      <ion-item button detail="true" (click)="changePassword()">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-label>Changer le mot de passe</ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>

<ion-footer class="save-footer" *ngIf="profile">
  <ion-toolbar>
    <ion-button 
      expand="block" 
      class="save-button"
      (click)="saveProfile()">
      Enregistrer les modifications
    </ion-button>
  </ion-toolbar>
</ion-footer>
