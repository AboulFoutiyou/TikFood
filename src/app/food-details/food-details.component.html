<ion-content class="details-offre">

  <!-- Header avec fond orange -->
  <div class="header-offre">
    <ion-icon name="arrow-back" (click)="goBack()"></ion-icon>

    <h2>Détails de l'offre</h2>
    <div class="image-container">
      <div class="image-placeholder">
        <ion-img 
          [src]="product?.images[0]" 
          [alt]="product?.name"
          class="product-image">
        </ion-img></div>
    </div>
  </div>

  <!-- Contenu de l'offre -->
  <div class="offre-content">

    
    <div class="content-wrapper">
    <!-- Product Image -->
    <!-- <div class="product-image-container">
      <div class="product-image">
        <div class="image-placeholder">
          <ion-icon name="image-outline" size="large"></ion-icon>
        </div>
      </div>
    </div> -->

    <!-- Product Details Card -->
    <ion-card class="product-details-card">
      <ion-card-content>
        <!-- Restaurant Info -->
        <div class="info-item">
          <ion-icon name="restaurant-outline" class="info-icon"></ion-icon>
          <span class="info-text">{{ product?.vendorName || "Inconnu" }}</span>
        </div>
        
        <!-- Product Name -->
        <div class="product-name">
          <span class="name-text" >{{ product?.name || 'Aucun Produit' }}</span>
          <!-- <ion-chip class="quantity-chip" color="light">
            <ion-label>(Q1)</ion-label>
          </ion-chip> -->
        </div>
        
        <!-- Price -->
        <div class="price">{{ product?.price }} F CFA</div>
        
        <!-- Description -->
        <div class="description">
          <h3>Description:</h3>
          <p>{{ product?.description }}</p>
        </div>
        
        <!-- Total Price -->
        <div class="total-price">
          <div class="total-label">Prix total:</div>
          <div class="total-amount">{{ getTotalPrice() }} F CFA</div>
        </div>
        
        <!-- Quantity Selector -->
        <div class="quantity-selector">
          <ion-button 
            fill="outline" 
            shape="round" 
            size="small"
            color="warning"
            (click)="decreaseQuantity()"
            [disabled]="quantity <= 1">
            <ion-icon name="remove" slot="icon-only"></ion-icon>
          </ion-button>
          
          <span class="quantity-display">{{ quantity }}</span>
          
          <ion-button 
            fill="outline" 
            shape="round" 
            size="small"
            color="warning"
            (click)="increaseQuantity()">
            <ion-icon name="add" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Order Button -->
    <div class="order-section">
      <ion-button 
        expand="block" 
        shape="round" 
        size="large"
        class="order-button"
        (click)="placeOrder()">
        <ion-icon name="bag-handle-outline" slot="start"></ion-icon>
        Commander
      </ion-button>
    </div>
  </div>

  </div>

</ion-content>
