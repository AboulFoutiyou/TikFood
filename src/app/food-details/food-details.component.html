<!-- Fichier HTML -->

<ion-content [fullscreen]="true" class="product-detail-page">
  
  <!-- HEADER IMMERSIF -->
  <div class="header-container">
    <div class="header-background">
      <ion-img 
        [src]="product?.images[0]" 
        [alt]="product?.name"
        class="product-bg-image">
      </ion-img>
      <!-- Superposition d'un dégradé pour la lisibilité -->
      <div class="header-scrim"></div>
    </div>
    
    <!-- Barre de navigation flottante -->
    <ion-toolbar class="floating-toolbar">
      <ion-buttons slot="start">
        <ion-button class="back-button" (click)="goBack()">
          <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title>Détails du produit</ion-title>
    </ion-toolbar>
  </div>

  <!-- CONTENU PRINCIPAL (LA "CARTE") -->
  <div class="content-container">
    <!-- Nom du Vendeur -->
    <div class="vendor-info-chip" (click)="navigateToVendor(product?.vendorId)">
      <ion-avatar>
        <!-- Idéalement, l'avatar du vendeur ici -->
        <ion-icon name="restaurant-outline"></ion-icon>
      </ion-avatar>
      <ion-label>{{ vendorName }}</ion-label>
    </div>
    
    <!-- Titre et Prix -->
    <div class="title-section">
      <h1 class="product-name">{{ product?.name || 'Aucun Produit' }}</h1>
      <div class="product-price">{{ formatPrice(product?.price) }} F CFA</div>
    </div>

    <!-- Description -->
    <div class="description-section">
      <h3>Description</h3>
      <p>{{ product?.description }}</p>
    </div>

    <!-- Sélecteur de Quantité -->
    <div class="quantity-section">
      <h3>Quantité</h3>
      <div class="quantity-selector">
        <ion-button 
          fill="clear" 
          class="quantity-btn"
          (click)="decreaseQuantity()"
          [disabled]="quantity <= 1">
          <ion-icon name="remove-circle-outline" slot="icon-only"></ion-icon>
        </ion-button>
        
        <span class="quantity-display">{{ quantity }}</span>
        
        <ion-button 
          fill="clear" 
          class="quantity-btn"
          (click)="increaseQuantity()">
          <ion-icon name="add-circle-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>
  </div>

  <!-- FOOTER COLLANT POUR LA COMMANDE -->
<ion-footer class="order-footer">
  <ion-toolbar>
    <div class="footer-content">
      <div class="total-price-section">
        <span class="total-label">Total</span>
        <span class="total-amount">{{ getTotalPrice() }} F CFA</span>
      </div>
      <ion-button 
        class="order-button"
        (click)="placeOrder()">
        Ajouter à la commande
        <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>

</ion-content>
